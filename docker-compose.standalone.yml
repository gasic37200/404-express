# 404-express만 공개 서버에 따로 띄울 때 쓴다 (Caddy가 80/443으로 HTTPS 공개).
# 운영 EC2(Replant와 같은 서버)에서는 Nginx와 80/443이 충돌하므로 쓰지 않는다. 운영은 docker-compose.prod.yml.
# 실행: docker compose -f docker-compose.standalone.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/courier.db
    volumes:
      - courier-data:/data

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  courier-data:
  caddy-data:
